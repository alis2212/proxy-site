<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rafat Portal - Secure Access</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100vh;
            background: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Lock Screen Styling */
        #lock-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            background: rgba(15, 23, 42, 0.98);
            z-index: 99999;
        }

        .card {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 380px;
            width: 90%;
        }

        .card h2 {
            margin-bottom: 12px;
            color: #38bdf8;
            font-size: 22px;
        }

        .card p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        
        .btn {
            background-color: #22c55e;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s ease;
            width: 100%;
            box-shadow: 0 4px 6px -1px rgba(34, 197, 94, 0.3);
        }

        .btn:hover {
            background-color: #16a34a;
        }

        /* Main Website Content */
        #main-content {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Lock Screen (24 Hours Session Lock) -->
    <div id="lock-screen">
        <div class="card">
            <h2>🔒 Secure Access Locked</h2>
            <p>Is content ko dekhne ke liye niche button par click karke key generate karein. Session 24 ghante tak active rahega.</p>
            
            <!-- Yahan apna AdroLinks ka link daalein -->
            <a href="https://arolinks.com/rafathub" class="btn" target="_blank">Generate Key / Verify</a>
        </div>
    </div>

    <!-- Main Content Area -->
    <div id="main-content">
        <!-- Yahan apna Cloudflare Worker ka URL daalein -->
        <iframe src="https://wispy-sea-8ba5.alikhan7001043524.workers.dev/" title="Protected Content"></iframe>
    </div>

    <script>
        // 1. Check karein ki user ad cross karke ?key=verified ke sath wapas aaya hai ya nahi
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('key') === 'verified') {
            const expiryTime = new Date().getTime() + (24 * 60 * 60 * 1000);
            localStorage.setItem('ansu_session_expiry', expiryTime);
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        // 2. Session check karne ka logic
        function checkSession() {
            const expiryTime = localStorage.getItem('ansu_session_expiry');
            const now = new Date().getTime();

            if (expiryTime && now < expiryTime) {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            } else {
                document.getElementById('lock-screen').style.display = 'flex';
                document.getElementById('main-content').style.display = 'none';
            }
        }

        checkSession();
    </script>

</body>
</html>
