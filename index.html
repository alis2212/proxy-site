<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Page</title>
    <style>
        /* Page ko clean rakhne ke liye margins aur padding 0 kar rahe hain */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Iframe ko full screen adjust karne ke liye */
        .content-frame {
            width: 100%;
            height: 100vh;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Yahan 'src' me apne dost ki website ka link daal dein -->
    <iframe src="https://stream.aryavidya.cc/" class="content-frame" title="Embedded Content"></iframe>

</body>
</html>
